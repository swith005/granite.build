# YAML-driven spec for test/integration/ibm/buildrunner/skypilot/kube_vela1_gb/test_1step.py.
# Vela copy of test-data/integration/standalone/buildrunner/skypilot_kube/1step/buildtest.yaml.
targets:
  - pod-run
target_expectations:
  - target_name: pod-run
    # step_count = 5, as on kind and slurm: the hfpull step for the hf input (a
    # separate pod writing to the shared volume) + the command step + one hfpush
    # step per artifact marker (output_model1 emits two, output_model2 one). The
    # env:// output moves no bytes, so it queues no push step.
    step_count: 5
    input_artifact_count: 1    # input_model
    output_artifact_count: 3   # output_model1, output_model2, env_output
    # Not asserted under standalone's NoopLineageStore; CALIBRATE on a lineage run.
    jobstats_count: 1
# The shared standalone space, so the SHIPPED
# configurations/assets/environments/skypilot/kubernetes/vela1-gb/environment.yaml is
# the env under test. Relative to this YAML's directory. If the env moves to the
# internal gb-test space (open question on issue 691), point this at gb-test the
# way slurm_bluevela/1step does.
space_uri: ../../../../../../../configurations/spaces/local
# Same coverage as the kind spec: `tests` defaults to runner + runner_cancellation,
# and simulate_step_failure injects one failure so AnyFailureRetryStrategy tears
# the pod down and relaunches it as <cluster>-r1.
simulate_step_failure: true
# Pod scheduling on a shared cluster + first image pull + the hfpull step.
# CALIBRATE after the first green run on Vela.
timeout_minutes: 30
