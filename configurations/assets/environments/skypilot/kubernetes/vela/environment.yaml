# SkyPilot on the Vela OpenShift cluster, namespace (OpenShift project)
# granite-build, with shared storage. The remote counterpart of
# skypilot/kubernetes/local: same shared-volume model, same build fixtures.
#
# DRAFT (issue 691): not yet run against Vela. The claim name and the pod
# security settings below still need confirming on the cluster.
#
# One-time setup per user:
#   1. Log in. OpenShift names the context it creates after you, so a shared env
#      cannot pin it directly:
#        oc login --web --server=<Vela API server URL>
#   2. Add the fixed alias this env pins, pointing at that login:
#        kubectl config set-context gb-vela \
#          --cluster="$(kubectl config view --minify -o jsonpath='{.contexts[0].context.cluster}')" \
#          --user="$(kubectl config view --minify -o jsonpath='{.contexts[0].context.user}')" \
#          --namespace=granite-build
#      The alias reuses the login's user entry, so a later `oc login` (tokens
#      expire) refreshes it too; the alias itself never needs recreating.
#   3. Check SkyPilot sees it:  sky check kubernetes
#
# Shared storage: every pod mounts the ReadWriteMany claim gb-shared at /shared,
# which is this env's shared_workdir. hf:// inputs are pulled once by a separate
# hfpull step into /shared/hf_cache and every later pod reads them there; targets
# hand files to each other through env:///shared/... It must be ReadWriteMany:
# SkyPilot refuses to start a pod on a ReadWriteOnce claim another pod still
# uses, and pods overlap (hfpull and its consumer, a teardown and a relaunch).
#
# OpenShift runs pods as an arbitrary non-root UID from the namespace's SCC range.
# SkyPilot's pod startup installs any missing bootstrap packages with apt-get, so
# a step image should already contain them (rsync curl wget netcat gcc patch
# pciutils openssh-server), or the namespace needs an SCC that allows root. See
# docs/environments/skypilot-kubernetes.md (Custom images).
name: sky-kube-vela
type: Skypilot
subtype: kubernetes
config:
  default_cloud: kubernetes
  # Applied as AUTODOWN on Kubernetes; see skypilot/kubernetes/environment.yaml.
  idle_minutes_to_autostop: 15
  shared_workdir: /shared
  # Deep-merged into ~/.sky/config.yaml at launch. Lists there are REPLACED, not
  # merged, so everything pod-level is scoped to the gb-vela context and can never
  # overwrite a pod_config kept for other clusters.
  cloud_config:
    kubernetes:
      # SkyPilot launches only into this context, never the CURRENT one. NOTE: this
      # lands in the GLOBAL SkyPilot config, so plain `sky` use on this machine is
      # also limited to gb-vela until a build on another environment replaces it.
      allowed_contexts:
        - gb-vela
      context_configs:
        gb-vela:
          # Takes precedence over the namespace in the kubeconfig context
          # (SkyPilot 0.14: kubernetes.context_configs.<context>.namespace).
          namespace: granite-build
          pod_config:
            spec:
              volumes:
                - name: gb-shared
                  persistentVolumeClaim:
                    claimName: gb-shared
              containers:
                # SkyPilot's container, merged by name.
                - name: ray-node
                  volumeMounts:
                    - name: gb-shared
                      mountPath: /shared
assetstores:
  - store_uri: space://assetstores/hf
    pull:
      - mode: default
        config:
          # Separate hfpull step, cached on the shared volume (as on slurm).
          cache_path: /shared/hf_cache
    push:
      - mode: default
        config: {}
